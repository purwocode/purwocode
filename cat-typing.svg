<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes typing {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(5px); }
    }
    @keyframes blink {
      0%, 49%, 100% { fill: #000; }
      50%, 99% { fill: #fff; }
    }
    .cat-body { animation: typing 0.6s infinite; }
    .cat-eye { animation: blink 1s infinite; }
  </style>
  
  <!-- Cat body -->
  <g class="cat-body">
    <!-- Head -->
    <circle cx="80" cy="80" r="35" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
    
    <!-- Ears -->
    <polygon points="50,50 40,20 60,35" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
    <polygon points="110,50 120,20 100,35" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
    <polygon points="50,50 45,35 55,40" fill="#FFB6C1"/>
    <polygon points="110,50 115,35 105,40" fill="#FFB6C1"/>
    
    <!-- Eyes -->
    <circle cx="65" cy="70" r="8" class="cat-eye" stroke="#000" stroke-width="1"/>
    <circle cx="95" cy="70" r="8" class="cat-eye" stroke="#000" stroke-width="1"/>
    <circle cx="67" cy="69" r="4" fill="#000"/>
    <circle cx="97" cy="69" r="4" fill="#000"/>
    
    <!-- Nose -->
    <polygon points="80,85 75,90 85,90" fill="#FFB6C1"/>
    
    <!-- Mouth -->
    <path d="M 80 90 Q 75 95 70 92" stroke="#000" stroke-width="2" fill="none"/>
    <path d="M 80 90 Q 85 95 90 92" stroke="#000" stroke-width="2" fill="none"/>
    
    <!-- Body -->
    <ellipse cx="80" cy="140" rx="40" ry="45" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
    
    <!-- Front paws -->
    <rect x="60" y="170" width="12" height="20" rx="6" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
    <rect x="100" y="170" width="12" height="20" rx="6" fill="#FDB4B4" stroke="#000" stroke-width="2"/>
  </g>
  
  <!-- Keyboard -->
  <g>
    <rect x="20" y="150" width="160" height="40" rx="5" fill="#333" stroke="#000" stroke-width="2"/>
    <text x="100" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#0F0">
      Coding...
    </text>
  </g>
  
  <!-- Sparkles -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="30" cy="40" r="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="30" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="80" r="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Text -->
  <text x="150" y="195" font-size="12" fill="#666">
    Typing something great...
  </text>
</svg>